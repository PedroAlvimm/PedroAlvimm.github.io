    <text x="600" y="200" text-anchor="middle" fill="#79c9df">RODADA 3</text>
    <text x="75" y="235" fill="#5edfff">═════════════════════════════════════════════════════════════</text>
    <text x="92" y="285" fill="#ffffff" font-weight="700">PEDRO</text>
    <text x="650" y="285" fill="#ffffff" font-weight="700">COMPUTADOR</text>
    <text x="92" y="330">    A B C D E</text>
    <text x="92" y="365"> 1  ~ ~ ~ ~ ~</text>
    <text x="92" y="400"> 2  ~ ~ ~ ~ ~</text>
    <text x="92" y="435"> 3  ~ <tspan fill="#4dd599">N N N N</tspan></text>
    <text x="92" y="470"> 4  <tspan fill="#4dd599">N N</tspan> ~ ~ ~</text>
    <text x="92" y="505"> 5  ~ ~ ~ ~ <tspan fill="#68a9ff">O</tspan></text>
    <text x="650" y="330">    A B C D E</text>
    <text x="650" y="365"> 1  <tspan fill="#68a9ff">O</tspan> ~ ~ ~ ~</text>
    <text x="650" y="400"> 2  ~ ~ ~ ~ ~</text>
