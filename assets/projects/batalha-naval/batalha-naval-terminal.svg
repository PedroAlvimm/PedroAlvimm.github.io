<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Batalha Naval em execução no terminal</title>
  <desc id="desc">Captura da versão atual do jogo mostrando os tabuleiros de Pedro e do computador na rodada três.</desc>
  <rect width="1200" height="800" rx="28" fill="#07131f"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="#0d1b2a" stroke="#27445d" stroke-width="2"/>
  <circle cx="65" cy="65" r="9" fill="#ff6b6b"/>
  <circle cx="94" cy="65" r="9" fill="#ffd166"/>
  <circle cx="123" cy="65" r="9" fill="#4dd599"/>
  <text x="600" y="72" text-anchor="middle" fill="#8aa2b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">python batalha_naval.py • branch main</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#d9f4ff">
