    <text x="650" y="470"> 4  ~ ~ ~ ~ ~</text>
    <text x="650" y="505"> 5  ~ ~ ~ ~ ~</text>
    <text x="92" y="570" fill="#c8d6e5">Seus navios afundados: 0/3</text>
    <text x="650" y="570" fill="#c8d6e5">Inimigos afundados: 0/3</text>
    <text x="75" y="620" fill="#5edfff">─────────────────────────────────────────────────────────────</text>
    <text x="120" y="670"><tspan fill="#4dd599">N</tspan> navio   <tspan fill="#ff6b6b">X</tspan> acerto   <tspan fill="#68a9ff">O</tspan> água   <tspan fill="#5edfff">~</tspan> desconhecido</text>
    <text x="75" y="720" fill="#5edfff">─────────────────────────────────────────────────────────────</text>
